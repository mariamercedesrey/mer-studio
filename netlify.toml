[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Spanish 404 for anything missing under /es/ (the root 404.html stays English).
[[redirects]]
  from = "/es/*"
  to = "/es/404/index.html"
  status = 404
