le="background:var(--action-primary-background);color:var(--action-primary-text);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500">action/primary</div><div style="background:var(--action-secondary-background);color:var(--action-secondary-text);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500">action/secondary</div><div style="background:var(--action-disabled-background);color:var(--action-disabled-text);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500">action/disabled</div></div></body></html>
