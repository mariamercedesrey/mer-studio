<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff;color:var(--text-primary);font-family:var(--font-display)}.l{font-family:var(--font-technical);font-size:11px;letter-spacing:.04em;color:rgb(119,119,119)}.v{font-family:var(--font-technical);font-size:10px;color:rgb(131,131,131)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 24px">
<div style="display:flex;flex-direction:column;gap:10px"><div style="height:60px;display:flex;flex-direction:column;justify-content:center;gap:20px"><div style="height:1px;background:rgba(120,120,120,.2)"></div><div style="height:1px;background:rgba(120,120,120,.2)"></div></div><span class="v">1px rgba(120,120,120,.2) list divider</span></div>
<div style="display:flex;flex-direction:column;gap:10px"><div style="height:60px;border:1px dashed rgb(155,155,155)"></div><span class="v">1px dashed rgb(155,155,155) article</span></div>
<div style="display:flex;flex-direction:column;gap:10px"><div style="height:60px;background:rgb(20,20,20);padding:8px"><div style="height:100%;border:.4px dashed rgb(246,246,246)"></div></div><span class="v">0.4–0.75px dashed on ink</span></div>
<div style="display:flex;flex-direction:column;gap:10px"><div style="height:60px;display:flex;align-items:center"><span style="height:48px;padding:0 26px;border-radius:55px;box-shadow:inset 0 0 0 1px rgb(20,20,20);display:inline-flex;align-items:center;font-size:14px;font-weight:500;letter-spacing:.03em">ASOCIART.COM ↗</span></div><span class="v">1px inset outline pill</span></div></div></body></html>
